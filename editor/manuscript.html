<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Manuscript Management</title>

<link
rel="stylesheet"
href="../style.css">

</head>

<body>

<div class="container">

<!-- ==========================
MANUSCRIPT INFORMATION
========================== -->

<div class="header">

<h1>
Journal Management System
</h1>

<p>
Journal of Materials Intelligence and Computing
</p>

</div>

<div
id="manuscriptInfo"
class="card">

Loading manuscript...

</div>

<!-- ==========================
EDITOR AND REVIEWER ASSIGNMENT
========================== -->

<div class="card">

<!-- ==========================
ASSIGN EDITOR
========================== -->

<h2 id="assignEditorTitle">

Assign Editor

</h2>

<select id="editorSelect">

<option value="">
Select Editor
</option>

</select>

<button
id="assignEditorButton"
onclick="assignEditor()">

Assign Editor

</button>

<div id="currentEditor"></div>

<hr style="margin:25px 0;">

<!-- ==========================
ASSIGN REVIEWER
========================== -->

<h2>

Assign Reviewer

</h2>

<select
id="reviewerSelect"
onchange="selectReviewer()">

<option value="">
Select Reviewer
</option>

</select>

<div
id="reviewerInfo"
class="card"
style="
margin-top:10px;
padding:10px;
display:none;
">

</div>

<input
type="email"
id="reviewerEmail"
placeholder="Reviewer Email"
readonly>

<input
type="date"
id="reviewDeadline">

<button
onclick="assignReviewer()">

Assign Reviewer

</button>

<!-- ==========================
ADD NEW REVIEWER
========================== -->

<div
style="margin-top:20px;">

<button
type="button"
onclick="showAddReviewerForm()">

* Add New Reviewer

</button>

</div>

<div
id="addReviewerForm"
class="card"
style="
display:none;
margin-top:15px;
padding:15px;
background:#f8f8f8;
">

<h3>

Add New Reviewer

</h3>

<input
type="text"
id="newReviewerName"
placeholder="Reviewer Name">

<br><br>

<input
type="email"
id="newReviewerEmail"
placeholder="Reviewer Email">

<br><br>

<input
type="text"
id="newReviewerAffiliation"
placeholder="Affiliation">

<br><br>

<input
type="text"
id="newReviewerExpertise"
placeholder="Expertise">

<br><br>

<button
type="button"
onclick="addNewReviewer()">

Save Reviewer

</button>

<button
type="button"
onclick="hideAddReviewerForm()">

Cancel

</button>

</div>

</div>

<!-- ==========================
ASSIGNED REVIEWERS
========================== -->

<div class="card">

<h2>

Assigned Reviewers

</h2>

<table id="reviewerTable">

<thead>

<tr>

<th>
Email
</th>

<th>
Status
</th>

<th>
Review Submitted
</th>

<th>
Deadline
</th>

<th>
Review Link
</th>

<th>
Invitation
</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

<!-- ==========================
REVIEWS RECEIVED
========================== -->

<div class="card">

<h2>

Reviews Received

</h2>

<div id="reviewsContainer">

No reviews yet.

</div>

</div>

<!-- ==========================
EDITORIAL DECISION
========================== -->

<div class="card">

<h2>

Editorial Decision

</h2>

<label>

<b>
Decision Type
</b>

</label>

<br><br>

<select id="decisionType">

<option value="Recommendation">

Recommendation

</option>

<option value="Final">

Final Decision

</option>

</select>

<br><br>

<label>

<b>
Decision
</b>

</label>

<br><br>

<select id="decision">

<option>
Accept
</option>

<option>
Minor Revision
</option>

<option>
Major Revision
</option>

<option>
Reject
</option>

</select>

<br><br>

<textarea
id="decisionRemarks"
rows="5"
placeholder="Editorial remarks...">
</textarea>

<br><br>

<button
onclick="updateDecision()">

Update Decision

</button>

</div>

<!-- ==========================
JAVASCRIPT
========================== -->

<script src="manuscript.js"></script>

</body>

</html>

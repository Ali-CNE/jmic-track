<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>JMIC Editorial Login</title>

<link rel="stylesheet"
      href="../style.css">

</head>

<body>

<div class="container">

    <div class="header">

        <h1>
            Journal Management System
        </h1>

        <p>
            Journal of Materials Intelligence and Computing
        </p>

    </div>


    <div class="card">

        <h2>
            Editorial Office Login
        </h2>


        <input
            type="email"
            id="email"
            placeholder="Editor Email"
            autocomplete="username"
        >


        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
        >


        <button
            onclick="login()">

            Login

        </button>


        <p
            id="loginMessage">
        </p>

    </div>

</div>


<script src="login.js"></script>

</body>

</html>
